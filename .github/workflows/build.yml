name: Android Debug Build - Creates Release

on:
  push:
    branches: [ main, master, awok-only ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        run: |
          chmod +x gradlew || (wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip && unzip -q gradle-8.5-bin.zip && gradle-8.5/bin/gradle wrapper --gradle-version 8.5 && chmod +x gradlew)

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --info --stacktrace 2>&1 | tee /tmp/build_full.log
          BUILD_EXIT="${PIPESTATUS[0]}"
          echo ""
          echo "========== KOTLIN COMPILER ERRORS =========="
          grep -E "^e: |: error:" /tmp/build_full.log | head -100 || echo "(no Kotlin error lines found in output)"
          echo "============================================="
          exit "$BUILD_EXIT"

      - name: Display APK Info
        run: |
          echo "✅ BUILD COMPLETE"
          ls -lh app/build/outputs/apk/debug/

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: Pen15 v3.0.${{ github.run_number }} (${{ github.ref_name }})
          body: |
            ## Pen15 - Pentest Dashboard v3.0

            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`

            ### Download
            - app-debug.apk (Ready to install)

            ### Installation
            1. Download APK to phone
            2. Enable "Install Unknown Apps" for your browser/file manager
            3. Tap APK to install

            **Flipper Zero USB + AWOK GPIO bridge included**

            🤖 Auto-built by GitHub Actions
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
