name: Android Debug Build - Creates Release

on:
  push:
    branches: [ main, master, awok-only, ux-redesign ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        run: |
          chmod +x gradlew || (wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip && unzip -q gradle-8.5-bin.zip && gradle-8.5/bin/gradle wrapper --gradle-version 8.5 && chmod +x gradlew)

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --info --stacktrace 2>&1 | tee /tmp/build_full.log
          BUILD_EXIT="${PIPESTATUS[0]}"
          echo ""
          echo "========== KOTLIN COMPILER ERRORS =========="
          grep -E "^e: |: error:" /tmp/build_full.log | head -100 || echo "(no Kotlin error lines found in output)"
          echo "============================================="
          exit "$BUILD_EXIT"

      - name: Display APK Info
        run: |
          echo "✅ BUILD COMPLETE"
          ls -lh app/build/outputs/apk/debug/

      - name: Build Pen15 FAP (Flipper App Package)
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build-fap
        with:
          sdk-channel: release
          app-dir: fap/pen15_controller

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: Pen15 v3.0.${{ github.run_number }} (${{ github.ref_name }})
          body: |
            ## Pen15 - Pentest Dashboard v3.0

            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`

            ### Downloads
            - **app-debug.apk** — Install on phone
            - **pen15_controller.fap** — Install on Flipper SD card

            ### Installation
            **Phone (APK):**
            1. Download app-debug.apk to phone
            2. Enable "Install Unknown Apps" for your browser/file manager
            3. Tap APK to install

            **Flipper Zero (FAP):**
            1. Download pen15_controller.fap
            2. Copy to Flipper SD card: `/apps/Tools/pen15_controller.fap`
            3. On Flipper: Apps → Tools → Pen15 Controller
            4. Then connect USB OTG and tap Connect in the phone app

            🤖 Auto-built by GitHub Actions
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.build-fap.outputs.fap-artifacts }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
