name: Android Debug Build - Creates Release

on:
  push:
    branches: [ main, master, awok-only, ux-redesign, 'cursor/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        run: |
          chmod +x gradlew || (wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip && unzip -q gradle-8.5-bin.zip && gradle-8.5/bin/gradle wrapper --gradle-version 8.5 && chmod +x gradlew)

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --info --stacktrace 2>&1 | tee /tmp/build_full.log
          BUILD_EXIT="${PIPESTATUS[0]}"
          echo ""
          echo "========== KOTLIN COMPILER ERRORS =========="
          grep -E "^e: |: error:" /tmp/build_full.log | head -100 || echo "(no Kotlin error lines found in output)"
          echo "============================================="
          exit "$BUILD_EXIT"

      - name: Rename APK with commit SHA
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/pen15-v3.0.${{ github.run_number }}-${SHORT_SHA}.apk
          echo "✅ BUILD COMPLETE"
          ls -lh app/build/outputs/apk/debug/

      - name: Build Pen15 FAP (Flipper App Package)
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build-fap
        with:
          sdk-channel: release
          app-dir: fap/pen15_controller

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: Pen15 v3.0.${{ github.run_number }} (${{ github.ref_name }}) [${{ github.sha }}]
          body: |
            ## Pen15 - Pentest Dashboard v3.0

            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`
            **Build:** `#${{ github.run_number }}`

            ### Downloads
            - **pen15-v3.0.${{ github.run_number }}-*.apk** — Install on phone
            - **pen15_controller.fap** — Install on Flipper SD card

            ### Super Simple Setup
            1. Put the APK on the Android phone and tap it.
            2. If Android asks, tap **Allow / Install anyway**.
            3. Put `pen15_controller.fap` on the Flipper SD card at:
               `/apps/Tools/pen15_controller.fap`
            4. On the Flipper, open:
               **Apps → Tools → Pen15 Controller**
            5. Plug the Flipper into the phone with USB-C / OTG.
            6. Open PEN15 on the phone.
            7. Tap the **FLIPPER** box.
            8. Wait until the phone says **FAP OK**.
            9. For AWOK Mini 3 / Marauder: wire AWOK to the Flipper GPIO UART pins, then use the AWOK / Marauder cards.
            10. For recon tools: install Termux from F-Droid, then open PEN15 Settings and tap **CHECK STATUS**.

            If a box says **MISSING**, fix that box first. The app tells you the next step.

            🤖 Auto-built by GitHub Actions
          files: |
            app/build/outputs/apk/debug/pen15-v3.0.${{ github.run_number }}-*.apk
            ${{ steps.build-fap.outputs.fap-artifacts }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
