name: Emergency Build & Release
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/pen15-v3.0.${{ github.run_number }}-${SHORT_SHA}.apk

      - name: Build FAP (Flipper App Package)
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build-fap
        with:
          sdk-channel: release
          app-dir: fap/pen15_controller

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pen15 v3.0 Build ${{ github.run_number }}
          body: |
            ## Pen15 - Pentest Dashboard v3.0

            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`
            **Build:** `#${{ github.run_number }}`

            ### Downloads
            - **pen15-v3.0.*.apk** — Install on phone
            - **pen15_controller.fap** — Install on Flipper SD card

            ### Installation

            **Phone (APK):**
            1. Download the .apk to phone
            2. Enable "Install Unknown Apps" for your browser/file manager
            3. Tap APK to install

            **Flipper Zero (FAP):**
            1. Download pen15_controller.fap
            2. Copy to Flipper SD card: `/apps/Tools/pen15_controller.fap`
            3. On Flipper: **Apps → Tools → Pen15 Controller**
            4. Then connect USB OTG and tap Connect in the phone app

            ### Hardware Support
            - **AWOK Direct**: AWOK Dual Mini v3 via USB-C (no Flipper needed)
            - **AWOK via Flipper**: AWOK → GPIO pins 13/14 → Flipper → phone USB
            - **Flipper-only**: RFID, NFC, SubGHz, IR, iButton, BadUSB, GPIO

            Built by GitHub Actions
          files: |
            app/build/outputs/apk/debug/pen15-v3.0.*.apk
            ${{ steps.build-fap.outputs.fap-artifacts }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
