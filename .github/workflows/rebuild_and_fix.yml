name: Emergency Build & Release
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Setup modern Gradle (supports dependencyResolutionManagement)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Lint + Build Debug + Release APKs
        run: ./gradlew lintDebug assembleDebug assembleRelease --stacktrace

      - name: Compute release tag
        id: tag
        run: |
          TAG="build-${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Build (${{ github.ref_name }}) ${{ github.run_number }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
